<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fire | Game &amp; Watch Collection</title>
    <meta
      name="description"
      content="Play a mobile-friendly Fire recreation with Wide Screen gameplay rules, keyboard controls, touch controls, and offline support."
    />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../styles/site.css" />
    <link rel="stylesheet" href="./fire.css" />
  </head>
  <body>
    <header class="site-shell page-header">
      <div>
        <a class="page-header__link" href="../../">&larr; Back to collection</a>
        <p class="eyebrow">Game 01</p>
        <h1>Fire</h1>
      </div>
      <p class="muted">Wide Screen-inspired rescue play, responsive layout, keyboard + touch controls.</p>
    </header>

    <main class="site-shell stack">
      <section class="panel stack">

        <!-- Compact HUD bar: score | best | lives | mode -->
        <div class="hud-bar" aria-label="Game status">
          <div class="hud-bar__item">
            <span class="hud-bar__label">Score</span>
            <span class="hud-bar__value" id="score-value">0</span>
          </div>
          <div class="hud-bar__sep" aria-hidden="true"></div>
          <div class="hud-bar__item">
            <span class="hud-bar__label">Best</span>
            <span class="hud-bar__value" id="best-value">0</span>
          </div>
          <div class="hud-bar__sep" aria-hidden="true"></div>
          <div class="hud-bar__item hud-bar__lives" aria-label="Lives remaining">
            <span class="hud-life" id="hud-life-0" aria-hidden="true">♥</span>
            <span class="hud-life" id="hud-life-1" aria-hidden="true">♥</span>
            <span class="hud-life" id="hud-life-2" aria-hidden="true">♥</span>
          </div>
          <div class="hud-bar__sep" aria-hidden="true"></div>
          <div class="hud-bar__item">
            <span class="hud-bar__label">Mode</span>
            <span class="hud-bar__value" id="mode-value">Ready</span>
          </div>
          <div class="hud-bar__actions">
            <button type="button" id="pause-button">Pause</button>
            <button type="button" id="skin-button">Skin: Wide</button>
          </div>
        </div>

        <!-- Screen-reader-only status for accessibility -->
        <p class="sr-only" id="status-message" aria-live="polite">
          Press 1 for Game A, 2 for Game B, use arrow keys or A/D.
        </p>

        <div class="fire-device" id="cabinet">
          <aside class="fire-device__side fire-device__side--left">
            <div class="fire-device__brand">
              <span>LCD</span>
              <span>RESCUE</span>
              <span>GAME</span>
            </div>
            <button type="button" id="move-left-button" class="fire-device__big-button" aria-label="Move left"></button>
            <div class="fire-device__direction fire-device__direction--left">LEFT</div>
          </aside>

          <section class="fire-device__center">
            <div class="fire-device__title">FIRE</div>
            <div class="fire-device__screen-frame">
              <div class="fire-device__screen-accent">
                <canvas
                  class="fire-screen"
                  id="fire-screen"
                  width="960"
                  height="600"
                  aria-label="Fire game display"
                ></canvas>
              </div>
            </div>
            <div class="fire-device__footer">WIDE SCREEN</div>
          </section>

          <aside class="fire-device__side fire-device__side--right">
            <div class="fire-device__button-stack">
              <button type="button" id="start-a" class="fire-device__pill-button">Game A</button>
              <button type="button" id="start-b" class="fire-device__pill-button">Game B</button>
              <button type="button" id="sound-button" class="fire-device__pill-button fire-device__pill-button--sound">🔊 Sound</button>
            </div>
            <div class="fire-device__indicator-stack">
              <span>Alarm</span>
              <span>ACL</span>
            </div>
            <button type="button" id="move-right-button" class="fire-device__big-button" aria-label="Move right"></button>
            <div class="fire-device__direction fire-device__direction--right">RIGHT</div>
          </aside>
        </div>

        <!-- Mobile bottom control bar (hidden on desktop) -->
        <div class="game-controls-bar" id="game-controls-bar" aria-label="Game controls">
          <button type="button" class="game-controls-bar__move" id="mobile-left" aria-label="Move left">&#9664;</button>
          <div class="game-controls-bar__secondary">
            <button type="button" id="mobile-start-a" class="game-controls-bar__pill">Game A</button>
            <button type="button" id="mobile-start-b" class="game-controls-bar__pill">Game B</button>
            <button type="button" id="mobile-pause" class="game-controls-bar__pill">Pause</button>
            <button type="button" id="mobile-sound" class="game-controls-bar__pill game-controls-bar__pill--sound">🔊</button>
          </div>
          <button type="button" class="game-controls-bar__move" id="mobile-right" aria-label="Move right">&#9654;</button>
        </div>

        <div class="touch-controls" id="touch-controls" aria-label="Touch controls"></div>
      </section>
    </main>

    <script type="module" src="./fire.js"></script>
  </body>
</html>
